<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mother's Little Helper</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 15% -5%, #fbeee7 0%, rgba(251,238,231,0) 55%), radial-gradient(1000px 500px at 100% 0%, #eef2ee 0%, rgba(238,242,238,0) 50%), #f7f5f2;
        background-attachment: fixed;
        color: #2b2b2b;
        -webkit-font-smoothing: antialiased;
      }
      textarea:focus, input:focus, select:focus { outline: none; border-color: #c1694f !important; box-shadow: 0 0 0 3px rgba(193,105,79,0.12); }
      button { transition: transform 0.08s ease, box-shadow 0.15s ease, opacity 0.15s ease; }
      button:active:not(:disabled) { transform: translateY(1px); }
      details summary { list-style: none; }
      details summary::-webkit-details-marker { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./client.js"></script>
  </body>
</html>
